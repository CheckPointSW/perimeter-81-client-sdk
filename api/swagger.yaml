      - exceptData
      additionalProperties: true
    SplitTunnelingData:
      type: object
      properties:
        cidr:
          type: array
          items:
            type: string
            pattern: ^((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.?\b){4}\/([0-9]|[1-2][0-9]|3[0-2])$
          description: List of CIDR blocks for split tunneling configuration
          default: []
        addressObjectIds:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{11}$
          description: List of address object IDs from shared objects
          default: []
        updatableObjectIds:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: List of updatable object IDs (UUIDs)
          default: []
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/SplitTunnelingException'
          description: "Subnet exceptions within included ranges that bypass the tunnel.\n\n**Important:** Exceptions are only supported in 'out_of_tunnel' mode. If provided when defaultTunnelingMode is 'via_tunnel', \nthe request will be rejected with a 400 Bad Request error.\n\nBehavior in 'out_of_tunnel' mode:\n- New exceptions are validated against allowed ranges (from included destinations)\n- Saved exceptions are filtered according to actual allowed ranges\n- Results are merged and deduplicated\n- Empty array will be merged with existing exceptions and will not remove saved exceptions by itself\n- If included destinations are removed from the payload and there are saved exceptions related to those subnets, \n  these exceptions will also be removed from the saved data\n- If omitted, exceptions value remains unchanged\n"
      additionalProperties: true
    SplitTunnelingException:
      type: object
      description: "Subnet exception entry that can override the default tunnel behavior\nfor specific IPs or CIDR ranges inside the encryption domain.\n\n**Important:** Exceptions are only supported in 'out_of_tunnel' mode. If provided when defaultTunnelingMode is 'via_tunnel',\nthe request will be rejected with a 400 Bad Request error.\n\nThe destination must be in CIDR notation (e.g. 10.1.2.0/24 for a subnet,\n10.1.2.3/32 for a single IP).\n\nValidation Rules (out_of_tunnel mode only):\n- Exception destination must be within at least one of the allowed included destinations\n- Exception destination cannot be equal to any allowed included destination\n- Exception destination cannot be bigger (more general) than any allowed included destination\n- Exceptions in the request payload that violate these rules cause a 400 Bad Request; only stored exceptions are automatically filtered during processing\n\nException Lifecycle (out_of_tunnel mode only):\n- When included destinations are removed from the configuration, any saved exceptions that fall\n  outside the remaining allowed ranges are automatically removed\n- Exceptions are merged with existing saved exceptions and deduplicated by destination\n"
      properties:
        type:
          type: string
          enum:
          - cidr
          default: cidr
          description: Type of destination.
        destination:
          type: string
          description: IP or CIDR string, e.g. "10.1.2.0/24" or "10.1.2.3/32".
      required:
      - type
      - destination
      additionalProperties: true
    SplitTunnelingRequest:
      $ref: '#/components/schemas/SplitTunnelingBase'
    SplitTunnelingResponse:
      $ref: '#/components/schemas/SplitTunnelingBase'
