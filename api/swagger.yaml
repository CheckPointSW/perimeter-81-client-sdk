openapi: 3.0.0
info:
  version: 3.0.0
  title: Check Point - SASE Public API
  description: The YAML for Check Points SASE Public API
  contact: {}
x-amazon-apigateway-request-validators:
  validateRequestParametersAndHeaders:
    validateRequestParameters: true
    validateRequestHeaders: true
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/perimeter81/public-api-yaml/1.0.0
- description: SASE Public API US
  url: https://api.perimeter81.com/api/rest
- description: SASE Public API EU
  url: https://api.eu.sase.checkpoint.com/api/rest
- description: SASE Public API Australia
  url: https://api.au.sase.checkpoint.com/api/rest
- description: SASE Public API India
  url: https://api.in.sase.checkpoint.com/api/rest
- description: SASE Public API Canada
  url: https://api.ca.sase.checkpoint.com/api/rest
paths:
  /v3/ia/access/policy:
    get:
      description: List all access policy rules
      summary: Get all access policy rules
      operationId: getAccessPolicy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyRulesGetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
    post:
      description: 'Update/Create all access policy rules.

        Note that SASE offers a built-in IA policy.

        '
      summary: Update/Create all access policy rules
      operationId: updateAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessPolicyRulesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccessPolicyRulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      tags:
      - Internet Access Policies
    delete:
      description: Delete all access policy rules. Note that all internet traffic will be allowed after deletion.
      summary: Delete all access policy rules
      operationId: deleteAccessPolicy
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
  /v3/ia/https-inspection/policy:
    get:
      description: List all HTTPS Inspection policy rules
      summary: Get all HTTPS Inspection policy rules
      operationId: getHttpsInspectionPolicy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpsInspectionPolicyGetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
    post:
      description: 'Update/Create all HTTPS Inspection policy rules.

        Note that SASE offers a built-in HTTPS Inspection policy.

        '
      summary: Update/Create all HTTPS Inspection policy rules
      operationId: updateHttpsInspectionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertHttpsInspectionPolicy'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpsInspectionPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      tags:
      - Internet Access Policies
    delete:
      description: Delete all HTTPS Inspection policy rules
      summary: Delete all HTTPS Inspection policy rules
      operationId: deleteHttpsInspectionPolicy
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
  /v3/ia/status:
    get:
      description: Get Internet Access Security Enforcement Status. This status indicates whether Internet Access, Threat Prevention, and DLP are enabled or disabled.
      summary: Get Internet Access security enforcement status
      operationId: getIAStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  iaStatus:
                    type: string
                    enum:
                    - active
                    - inactive
                    example: active
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
    post:
      description: Update Internet Access Security Enforcement Status.This status indicates whether Internet Access, Threat Prevention, and DLP are enabled or disabled.
      summary: Update Internet Access security enforcement status
      operationId: setIAStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iaStatus:
                  type: string
                  enum:
                  - active
                  - inactive
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  iaStatus:
                    type: string
                    enum:
                    - active
                    - inactive
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Internet Access Policies
  /v3/objects/web-category:
    get:
      description: List all available Web categories
      summary: Get all Web categories
      operationId: getWebCategories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Objects
  /v3/objects/application-control/application:
    get:
      description: List all available Application Control applications
      summary: Get all applications available in Application Control applications
      operationId: getApplicationControlApplications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationControlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Objects
  /v3/networks/enhanced:
    get:
      tags:
      - Enhanced Networks
      summary: Get all enhanced networks
      description: 'Required permissions: `["network:read"]`<br><br>List all enhanced networks'
      operationId: getEnhancedNetworks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnhancedNetwork'
                description: Enhanced network list.
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
    post:
      tags:
      - Enhanced Networks
      summary: Create enhanced network
      description: 'Required permissions: `["network:create"]`<br><br>Create a new enhanced network with regions'
      operationId: createEnhancedNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployEnhancedNetwork'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '402':
          $ref: '#/components/responses/402_Insufficient_licenses'
        '403':
          $ref: '#/components/responses/403_Forbidden'
  /v3/networks/enhanced/{networkId}:
    get:
      tags:
      - Enhanced Networks
      summary: Get enhanced network by ID
      description: 'Required permissions: `["network:read"]`<br><br>Get a specific enhanced network'
      operationId: getEnhancedNetwork
      parameters:
      - $ref: '#/components/parameters/networkId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnhancedNetwork'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
    put:
      tags:
      - Enhanced Networks
      summary: Update enhanced network
      description: 'Required permissions: `["network:update"]`<br><br>Update an existing enhanced network'
      operationId: updateEnhancedNetwork
      parameters:
      - $ref: '#/components/parameters/networkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnhancedNetworkUpdate'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnhancedNetwork'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
    delete:
      tags:
      - Enhanced Networks
      summary: Delete enhanced network
      description: 'Required permissions: `["network:delete"]`<br><br>Delete an enhanced network and all its resources'
      operationId: deleteEnhancedNetwork
      parameters:
      - $ref: '#/components/parameters/networkId'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
  /v3/networks/enhanced/{networkId}/health:
    get:
      tags:
      - Enhanced Networks
      summary: Get enhanced network health status
      description: 'Required permissions: `["network:read"]`<br><br>Get health status of all tunnels in the enhanced network.'
      operationId: getEnhancedNetworkHealth
      parameters:
      - $ref: '#/components/parameters/networkId'
      responses:
        '200':
          description: Health status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnhancedHealthResponse'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
  /v3/networks/enhanced/harmony-sase-regions:
    get:
      operationId: Enhanced_NetworksControllerV2_getRegions
      summary: List of available Harmony SASE regions that supports enhanced networks
      description: 'Required permissions: `["addon:read"]`<br><br>List of regions.'
      responses:
        '200':
          description: Completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarmonySaseRegionsList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
      - Enhanced Regions
  /v3/networks/enhanced/network-customer-certificate:
    get:
      operationId: Enhanced_NetworksControllerV2_3_getNetworkCustomerCertificate
      summary: Get network customer certificate
      description: 'Required permissions: `["network:read"]`<br><br>Get network customer certificate details.'
      responses:
        '200':
          description: Completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCustomerCertificateResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
      - Enhanced Networks
  /v3/networks/enhanced/{networkId}/regions:
    get:
      tags:
      - Enhanced Regions
      summary: List regions
      description: 'Required permissions: `["network:read"]`<br><br>List all regions in an enhanced network'
      operationId: listEnhancedRegions
      parameters:
      - $ref: '#/components/parameters/networkId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnhancedRegion'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
    post:
      tags:
      - Enhanced Regions
      summary: Create enhanced region
      description: 'Required permissions: `["network:create"]`<br><br>Add a new region to an enhanced network'
      operationId: createEnhancedRegion
      parameters:
      - $ref: '#/components/parameters/networkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnhancedRegionCreate'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          description: Network region doesn't exists
  /v3/networks/enhanced/{networkId}/regions/{regionId}:
    get:
      tags:
      - Enhanced Regions
      summary: Get region
      description: 'Required permissions: `["network:read"]`<br><br>Get details of a specific region in an enhanced network'
      operationId: getEnhancedRegion
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnhancedRegion'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
    delete:
      tags:
      - Enhanced Regions
      summary: Delete enhanced region
      description: 'Required permissions: `["network:delete"]`<br><br>Remove a region from an enhanced network'
      operationId: deleteEnhancedRegion
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          description: Network region doesn't exists
  /v3/networks/enhanced/{networkId}/regions/{regionId}/scale-unit/increase:
    put:
      tags:
      - Enhanced Regions
      summary: Increase scale units
      description: 'Required permissions: `["network:update"]`<br><br>Increase the number of scale units in a region'
      operationId: increaseScaleUnit
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleUnitsOperation'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          description: Network region not found
  /v3/networks/enhanced/{networkId}/regions/{regionId}/scale-unit/reduce:
    put:
      tags:
      - Enhanced Regions
      summary: Reduce scale units
      description: 'Required permissions: `["network:update"]`<br><br>Reduce the number of scale units in a region'
      operationId: reduceScaleUnit
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleUnitsOperation'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          description: Network region not found
  /v3/networks/enhanced/{networkId}/privateDNS:
    get:
      tags:
      - Enhanced Private DNS
      summary: Get network-level private DNS settings
      description: 'Required permissions: `["network:read"]`<br><br>Get the private DNS configuration for an enhanced network'
      operationId: getEnhancedNetworkPrivateDNS
      parameters:
      - $ref: '#/components/parameters/networkId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDns'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
    put:
      tags:
      - Enhanced Private DNS
      summary: Update network-level private DNS settings
      description: 'Required permissions: `["network:update"]`<br><br>Update the private DNS configuration for an enhanced network. This operation

        fully replaces the configuration: always send the complete desired object.

        Any field omitted from `attributes` (such as `searchDomains`) is cleared, not

        preserved — to keep current values, resend the full object returned by GET.

        '
      operationId: updateEnhancedNetworkPrivateDNS
      parameters:
      - $ref: '#/components/parameters/networkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDnsUpdate'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '422':
          $ref: '#/components/responses/422_UnprocessableEntity'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
  /v3/networks/enhanced/{networkId}/regions/{regionId}/privateDNS:
    get:
      tags:
      - Enhanced Private DNS
      summary: Get region-level private DNS settings
      description: 'Required permissions: `["network:read"]`<br><br>Get the private DNS configuration for a specific region in an enhanced network'
      operationId: getEnhancedRegionPrivateDNS
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDns'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
    put:
      tags:
      - Enhanced Private DNS
      summary: Update region-level private DNS settings
      description: 'Required permissions: `["network:update"]`<br><br>Update the private DNS configuration for a region of an enhanced network. This

        operation fully replaces the configuration: always send the complete desired

        object. Any field omitted from `attributes` (such as `searchDomains`) is cleared,

        not preserved — to keep current values, resend the full object returned by GET.

        '
      operationId: updateEnhancedRegionPrivateDNS
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDnsUpdate'
      responses:
        '202':
          $ref: '#/components/responses/202_Accepted'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '422':
          $ref: '#/components/responses/422_UnprocessableEntity'
        '429':
          $ref: '#/components/responses/429_TooManyRequests'
  /v3/networks/enhanced/{networkId}/tunnels:
    get:
      tags:
      - Enhanced Tunnels
      summary: Get tunnels for a network
      description: 'Required permissions: `["network:read"]`<br><br>List all tunnels in a specific enhanced network'
      operationId: getEnhancedRegionTunnelsPerNetwork
      parameters:
      - $ref: '#/components/parameters/networkId'
      - name: page
        in: query
        required: false
        description: Specifies the current page of the paginated result set
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Defines the number of results per page
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnhancedTunnel'
                  itemsTotal:
                    type: number
                  page:
                    type: number
                  totalPage:
                    type: number
                required:
                - data
                - itemsTotal
                - page
                - totalPage
                additionalProperties: true
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
  /v3/networks/enhanced/{networkId}/regions/{regionId}/tunnels:
    get:
      tags:
      - Enhanced Tunnels
      summary: Get tunnels for a region
      description: 'Required permissions: `["network:read"]`<br><br>List all tunnels in a specific region of an enhanced network'
      operationId: getEnhancedRegionTunnelsPerRegion
      parameters:
      - $ref: '#/components/parameters/networkId'
      - $ref: '#/components/parameters/regionId'
      - name: page
        in: query
        required: false
        description: Specifies the current page of the paginated result set
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Defines the number of results per page
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnhancedTunnel'
                  itemsTotal:
                    type: number
                  page:
                    type: number
                  totalPage:
                    type: number
                required:
                - data
                - itemsTotal
                - page
                - totalPage
                additionalProperties: true
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
