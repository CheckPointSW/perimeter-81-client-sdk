    HttpsInspectionDestination:
      type: object
      description: Destination for HTTPS inspection rules
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - categories
          - domains
          - addresses
          - updatableObjects
          - applicationControlApplications
        value:
          description: Array of IDs (strings)
          type: array
          items:
            type: string
      additionalProperties: true
    HttpsInspectionPolicyGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            controlledBy:
              type: string
              enum:
              - quantum
              - hsase
              description: Indicates whether the policy is controlled by Quantum or Hsase
            bypassRules:
              type: array
              items:
                $ref: '#/components/schemas/HttpsInspectionRule'
            cleanupBypassRuleDefaultAction:
              type: string
              enum:
              - bypass
              - inspect
              - inspectNoDecrypt
              description: 'Default action for traffic not matched by any explicit bypass rule (the cleanup rule). Included in the response only when the tenant has the Inspection Policy feature enabled; when the feature is off the field is omitted entirely. Defaults to "inspect" when the tenant has the feature enabled but hasn''t configured a specific value.

                '
          additionalProperties: true
      additionalProperties: true
    HttpsInspectionPolicyResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            bypassRules:
              type: array
              items:
                $ref: '#/components/schemas/HttpsInspectionRule'
            controlledBy:
              type: string
              enum:
              - quantum
              - hsase
              description: Indicates whether the policy is controlled by Quantum or Hsase
            cleanupBypassRuleDefaultAction:
              type: string
              enum:
              - bypass
              - inspect
              - inspectNoDecrypt
              description: 'Echoes the persisted cleanup default action after the upsert so callers don''t need a follow-up GET. Included in the response only when the tenant has the Inspection Policy feature enabled; when the feature is off the field is omitted entirely. Defaults to "inspect" when the tenant has the feature enabled but hasn''t configured a specific value.

                '
          additionalProperties: true
      example:
        status: 200
        data:
          bypassRules:
          - id: rule-xyz789
            name: Bypass Financial Sites
            status: active
            priority: 0
            appliedOn: both
            action: bypass
            sources:
            - type: groups
              value:
              - group-id-456
            destinations:
            - type: categories
              value:
              - '100000018'
            log: disabled
          - id: rule-abc123
            name: Inspect Social Media
            status: active
            priority: 1
            appliedOn: agents
            action: httpInspection
            sources:
            - type: users
              value:
              - user-id-789
            destinations:
            - type: domains
              value:
              - domain-id-123
            log: summaryWithUrls
          - id: rule-def456
            name: Bypass App Control Apps
            status: active
            priority: 2
            appliedOn: agents
            action: bypass
            sources: []
            destinations:
            - type: applicationControlApplications
              value:
              - app-id-001
            log: disabled
          controlledBy: hsase
      additionalProperties: true
    HttpsInspectionRule:
      type: object
      required:
      - name
      - status
      - priority
      - destinations
      - sources
      - appliedOn
      properties:
        id:
          type: string
          description: Rule ID (optional in requests, auto-generated for new rules)
        name:
          type: string
          maxLength: 100
          pattern: ^[^<>]+$
          description: Rule name (cannot contain < or > characters)
        appliedOn:
          type: string
          enum:
          - sites
          - agents
          - both
          description: 'Where the rule is applied: Agents, Sites, or Both'
        priority:
          type: integer
          description: Rule priority. Updated automatically when rules are created/updated
        sources:
          type: array
          items:
            $ref: '#/components/schemas/HttpsInspectionSource'
          description: List of source objects
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/HttpsInspectionDestination'
          description: List of destination objects
        action:
          type: string
          enum:
          - bypass
          - inspect
          - inspectNoDecrypt
          description: 'Bypass or HTTPS Inspection action (optional, default: ''bypass''). ''inspect'' is always valid for ''sites'' appliedOn. When the Inspection Policy feature is enabled, ''inspect'' is also valid on ''agents'' and ''both''. ''inspectNoDecrypt'' requires the Inspection Policy feature and is only valid on ''agents'' appliedOn (rejected on ''sites'' and ''both'' regardless of the feature).'
        log:
          type: string
          enum:
          - disabled
          - summaryWithUrls
          description: HTTPS Inspection logging (optional) is disabled by default and is supported only for rules applied to agents
        status:
          type: string
          enum:
          - active
          - inactive
          description: Rule status
      additionalProperties: true
    HttpsInspectionSource:
      type: object
      description: Source definition for HTTPS inspection rules
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - users
          - groups
          - applications
          - addresses
          description: Source type
        value:
          description: Array of IDs (strings)
          type: array
          items:
            type: string
      additionalProperties: true
    IAErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code (e.g., 422, 500, 403)
          example: 422
        code:
          type: integer
          description: Same as status
          example: 422
        message:
          type: string
          description: Error message or message code
