components:
  schemas:
    ASN:
      type: integer
      description: Autonomous System Number (ASN) for BGP routing. It will be automatically assigned an ASN once creating the first dynamic tunnel in this network. The network ASN can never be changed once it is set.
      oneOf:
      - minimum: 1
        maximum: 64496
        description: Public ASN range
      - minimum: 64512
        maximum: 65535
        description: Private ASN range (16-bit)
      - minimum: 131072
        maximum: 4294967295
        description: Private ASN range (32-bit)
    AccessPolicyDestination:
      type: object
      description: Destination for access policy rules
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - categories
          - customUrls
          - applicationControlApplications
          - updatableObjects
        value:
          description: Array of IDs (strings)
          type: array
          items:
            type: string
      additionalProperties: true
    AccessPolicyRule:
      type: object
      required:
      - name
      - action
      - priority
      - status
      - conditions
      - destinations
      - sources
      - appliedOn
      properties:
        id:
          type: string
          description: Rule ID (optional in requests, auto-generated for new rules)
        name:
          type: string
          maxLength: 100
          pattern: ^[^<>]+$
          description: Rule name (cannot contain < or > characters)
        appliedOn:
          type: string
          enum:
          - sites
          - agents
          - both
          description: 'Where the rule is applied: Agents, Sites, or Both'
        action:
          type: string
          enum:
          - allow
          - block
          - warning
          description: Rule action
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          description: Optional time-based conditions, default is an empty array (no time constraints)
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicyDestination'
          description: List of destination objects
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicySource'
          description: List of source objects
        log:
          type: string
          enum:
          - disabled
          - summaryWithUrls
          description: 'Logging mode (optional) – If not specified, the service automatically sets the logging mode based on the rule action: Disabled for Allow actions, and SummaryWithUrls for Block and Warning actions'
        status:
          type: string
          enum:
          - active
          - inactive
          description: Rule status
        priority:
          type: integer
          description: Rule priority. Updated automatically when rules are created/updated
      additionalProperties: true
    AccessPolicyRulesGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            webRules:
              type: array
              items:
                $ref: '#/components/schemas/AccessPolicyRule'
            controlledBy:
              type: string
              enum:
              - quantum
              - hsase
              description: Indicates whether the policy is controlled by Quantum or Hsase
          additionalProperties: true
      additionalProperties: true
    AccessPolicySource:
      type: object
      description: Source definition for access policy rules
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - users
          - groups
          - addresses
        value:
          description: Array of IDs (strings)
          type: array
          items:
            type: string
      additionalProperties: true
    Address:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
        id:
          type: string
        value:
          type: array
          items:
            type: string
          description: Value must match valueType according to the YAML constraints
        valueType:
          type: string
          enum:
          - ip
          - list
          - cidr
          - fqdn
      additionalProperties: true
    AddressList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        page:
          type: integer
        totalPage:
          type: integer
        itemsTotal:
          type: integer
      additionalProperties: true
    Addresses:
      type: object
      properties:
        addresses:
          items:
            $ref: '#/components/schemas/AlphanumericWithSpace'
          type: array
          minItems: 1
          description: List of IDs of address objects.
      required:
      - addresses
      additionalProperties: true
    Alphanumeric:
      type: string
      pattern: ^[a-zA-Z0-9]+$
      description: Any alphanumeric value w/o space
      minLength: 1
    AlphanumericWithSpace:
      type: string
      pattern: ^[a-zA-Z0-9 ]+$
      description: Any alphanumeric value with space
      minLength: 1
    ApplicationAlias:
      type: object
      description: URL alias settings to access the application via a user-friendly URL under your own domain
      properties:
        aliasEnabled:
          type: boolean
        cname:
          type: string
          minLength: 1
        sslCertificate:
          type: string
          minLength: 1
      required:
      - aliasEnabled
      additionalProperties: true
    ApplicationAuth:
      type: object
      description: Authentication settings related to the application
      properties:
        authEnabled:
          type: boolean
        authUsername:
          type: string
