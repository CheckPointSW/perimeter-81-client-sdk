          description: User ID (optional)
          example: user-789
        data:
          type: object
          description: Additional error data (optional)
          properties:
            errors:
              type: array
              description: Array of validation errors
              items:
                type: object
                properties:
                  messageCode:
                    type: string
                    description: Standardized error code constant
                    example: VALIDATION_MULTIPLE_CATEGORIES_ELEMENTS
                  message:
                    type: string
                    description: User-friendly error message
                    example: Combine categories into one section
                  field:
                    type: string
                    description: Field name related to the error
                    example: sources.categories
                  ruleIndex:
                    type: integer
                    description: Index of the rule in the request array
                    example: 0
                  ruleId:
                    type: string
                    description: Rule ID
                    example: someId
                  ruleName:
                    type: string
                    description: Rule name
                    example: Block Social Media
                additionalProperties: true
            errorCount:
              type: integer
              description: Total number of errors
              example: 1
          additionalProperties: true
      additionalProperties: true
    IP:
