  /v3/objects/updatable-objects:
    get:
      operationId: getUpdatableObjects
      tags:
      - Objects
      parameters:
      - name: name
        in: query
        description: object name
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: cpId
        in: query
        description: Filters the results to include only updatable objects that match the specified Check Point object ID.
        schema:
          type: array
          maxItems: 100
          items:
            type: string
      - name: type
        in: query
        description: 'Filters updatable objects by feature category, reflecting differences in object support across categories.

          splitTunneling: Objects compatible with Split Tunneling configuration.

          internetAccess: Objects compatible with Internet Access policy.

          If not provided, returns all objects regardless of feature type.

          '
        schema:
          type: string
          enum:
          - splitTunneling
          - internetAccess
        example: splitTunneling
      - name: page
        in: query
        description: the page number to retrieve from the paginated results. Default is 1.
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        description: size of page
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: sort
        in: query
        description: sorts the results based on a specified field and order.
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Successful response with paginated list of updatable objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      properties:
                        type:
                          type: object
                          description: Filters updatable objects by their feature category based on supported vendors.
                          properties:
                            splitTunneling:
                              type: boolean
                              description: Objects compatible with Split Tunneling configuration.
                            internetAccess:
                              type: boolean
                              description: Objects compatible with Internet Access policy.
                          additionalProperties: true
                        cpId:
                          type: string
                          maxLength: 255
                          description: Check Point object ID
                        vendorId:
                          type: string
                          maxLength: 255
                          description: Vendor identifier
                        vendorParentId:
                          type: string
                          maxLength: 255
                          description: Parent vendor identifier for hierarchical relationships
                        vendorChildrenIds:
                          type: array
                          maxItems: 1000
                          items:
                            type: string
                          description: Child vendor identifiers
                        name:
                          type: string
                          maxLength: 255
                          description: Object name
                        inheritDescription:
                          type: boolean
                          description: Whether to inherit description from parent
                        inheritInfoText:
                          type: boolean
                          description: Whether to inherit info text from parent
                        inheritInfoUrl:
                          type: boolean
                          description: Whether to inherit info URL from parent
                        dataObjectsCount:
                          type: integer
                          minimum: 0
                          maximum: 999999999
                          description: Number of data objects associated with this updatable object
                      additionalProperties: true
                  page:
                    type: integer
                    minimum: 1
                    maximum: 999999999
                    description: Current page number
                  totalPage:
                    type: integer
                    minimum: 0
                    maximum: 999999999
                    description: Total number of pages
                  itemsTotal:
                    type: integer
                    minimum: 0
                    maximum: 999999999
                    description: Total number of items across all pages
                additionalProperties: true
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gumErrorResponse'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gumErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
