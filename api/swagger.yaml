    CustomDnsUpdate:
      type: object
      description: 'Request body for updating private DNS (PUT). This is a full replacement:

        always send the complete desired configuration. Any field omitted from

        `attributes` is cleared, not preserved — to keep current values, resend the

        full object returned by the corresponding GET endpoint. `attributes` is

        required. When `enabled` is `true`, `attributes.servers` must contain at

        least one entry. Requests that violate these rules are rejected with

        422 Unprocessable Entity.

        '
      required:
      - enabled
      - attributes
      properties:
        enabled:
          type: boolean
          description: Whether private DNS is enabled.
        attributes:
          $ref: '#/components/schemas/CustomDnsUpdateAttributes'
      additionalProperties: true
    CustomDnsUpdateAttributes:
      type: object
      description: 'Private DNS attributes for update (PUT) requests. Both `servers` and

        `searchDomains` are required (send `searchDomains: []` if you have none).

        Updates fully replace the attributes object, so send every field you want

        to keep; omitted fields are cleared.

        '
      required:
      - servers
      - searchDomains
      properties:
        servers:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            $ref: '#/components/schemas/CustomDnsServer'
          description: Private DNS servers. Required, and must contain at least one entry when enabled is true.
        searchDomains:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            type: string
            format: hostname
          description: DNS search domains. Required — send an empty array if you have none. Omitting it on update is rejected with 400; a non-empty value fully replaces any existing search domains.
        dnsPolicy:
          $ref: '#/components/schemas/DnsPolicy'
      additionalProperties: true
