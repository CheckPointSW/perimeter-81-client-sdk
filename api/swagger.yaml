    SplitTunnelingBase:
      type: object
      properties:
        defaultTunnelingMode:
          type: string
          description: "via_tunnel: Tunnel all internet traffic via Cloud, except the destinations listed in exceptData.\nout_of_tunnel: Do not tunnel internet traffic via Cloud, except the destinations listed in exceptData \n(i.e., only these destinations will be tunnelled).\n"
          example: via_tunnel
