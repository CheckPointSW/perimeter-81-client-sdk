        priority: 1
      properties:
        id:
          description: "Rule ID (optional in requests, auto-generated for new rules)"
          type: string
        name:
          description: Rule name (cannot contain < or > characters)
          maxLength: 100
          pattern: "^[^<>]+$"
          type: string
        appliedOn:
          description: "Where the rule is applied: Agents, Sites, or Both"
          enum:
          - sites
          - agents
          - both
          type: string
        action:
          description: "Rule action. 'redirect' requires the Redirect feature; when\
            \ the feature is not enabled for the tenant, adding or changing a rule\
            \ that redirects is rejected with 422 VALIDATION_REDIRECT_NOT_ENABLED."
          enum:
          - allow
          - block
          - warning
          - redirect
          type: string
        redirectUrl:
          description: |
            Absolute http or https URL the user is redirected to, up to 2048 characters and without a username or password. Required for 'redirect' rules and for 'block' rules with redirectAction 'afterBlockPage', otherwise the request is rejected with 422 VALIDATION_INVALID_REDIRECT_URL. On any other rule a valid URL is stored without taking effect, and applies again if the rule is switched back to redirecting.
          maxLength: 2048
          minLength: 8
          pattern: "^https?://[^\\s/$.?#].[^\\s]*$"
          type: string
        redirectAction:
          description: |
            Optional. Send 'afterBlockPage', with redirectUrl, to make a 'block' rule show the block page and then redirect; 'none' (the default) means it does not redirect. Leave it out on 'redirect' rules — the service always sets 'immediate'. Any other combination is rejected with 422 VALIDATION_INVALID_REDIRECT_ACTION, or VALIDATION_REDIRECT_NOT_ALLOWED_FOR_ACTION on 'allow' and 'warning' rules.
          enum:
          - immediate
          - afterBlockPage
          - none
          type: string
        conditions:
          description: "Optional time-based conditions, default is an empty array\
            \ (no time constraints)"
          items:
            $ref: "#/components/schemas/Condition"
          type: array
        destinations:
          description: List of destination objects
          items:
            $ref: "#/components/schemas/AccessPolicyDestination"
          type: array
        sources:
          description: List of source objects
          items:
            $ref: "#/components/schemas/AccessPolicySource"
          type: array
        log:
          description: "Logging mode (optional) – If not specified, the service automatically\
            \ sets the logging mode based on the rule action: Disabled for Allow actions,\
            \ and SummaryWithUrls for Block, Warning and Redirect actions"
          enum:
          - disabled
          - summaryWithUrls
          type: string
        status:
          description: Rule status
          enum:
          - active
          - inactive
          type: string
        priority:
          description: Rule priority. Updated automatically when rules are created/updated
          type: integer
      required:
      - action
      - appliedOn
      - conditions
      - destinations
      - name
      - priority
      - sources
      - status
      type: object
