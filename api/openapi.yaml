        type: object
      description: |
        Updates a static IPSec tunnel. Every field is optional, so send only what you want to change. The region cannot be changed after creation.
      example:
        authType: psk
        passphrase: Str0ng.Shared_Key01
        customerRootCA: GCt8HauIPH
        tunnelName: londonlink01
