security:
- bearer: []
paths:
  /v3/ia/access/policy:
    delete:
      description: Delete all access policy rules. Note that all internet traffic
        will be allowed after deletion.
      operationId: deleteAccessPolicy
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Delete all access policy rules
      tags:
      - Internet Access Policies
    get:
      description: List all access policy rules
      operationId: getAccessPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicyRulesGetResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get all access policy rules
      tags:
      - Internet Access Policies
    post:
      description: |
        Update/Create all access policy rules.
        Note that SASE offers a built-in IA policy.
      operationId: updateAccessPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessPolicyRulesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccessPolicyRulesResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update/Create all access policy rules
      tags:
      - Internet Access Policies
