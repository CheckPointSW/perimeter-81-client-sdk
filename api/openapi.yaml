    SplitTunnelingBase:
      additionalProperties: true
      example:
        defaultTunnelingMode: via_tunnel
        exceptData:
          cidr:
          - cidr
          - cidr
          addressObjectIds:
          - addressObjectIds
          - addressObjectIds
          updatableObjectIds:
          - updatableObjectIds
          - updatableObjectIds
