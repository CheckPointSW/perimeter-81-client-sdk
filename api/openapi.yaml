          - type: cidr
            destination: destination
          - type: cidr
            destination: destination
      properties:
        defaultTunnelingMode:
          description: "via_tunnel: Tunnel all internet traffic via Cloud, except\
            \ the destinations listed in exceptData.\nout_of_tunnel: Do not tunnel\
            \ internet traffic via Cloud, except the destinations listed in exceptData\
            \ \n(i.e., only these destinations will be tunnelled).\n"
          example: via_tunnel
          type: string
        exceptData:
          $ref: "#/components/schemas/SplitTunnelingData"
      required:
      - defaultTunnelingMode
      - exceptData
      type: object
    SplitTunnelingData:
      additionalProperties: true
      example:
        cidr:
        - cidr
        - cidr
        addressObjectIds:
        - addressObjectIds
        - addressObjectIds
        updatableObjectIds:
        - updatableObjectIds
        - updatableObjectIds
        exceptions:
        - type: cidr
          destination: destination
        - type: cidr
          destination: destination
      properties:
        cidr:
          default: []
          description: List of CIDR blocks for split tunneling configuration
          items:
            pattern: "^((25[0-5]|(2[0-4]|1\\d|[1-9]|)\\d)\\.?\\b){4}\\/([0-9]|[1-2][0-9]|3[0-2])$"
            type: string
          type: array
        addressObjectIds:
          default: []
          description: List of address object IDs from shared objects
          items:
            pattern: "^[a-zA-Z0-9]{11}$"
            type: string
          type: array
        updatableObjectIds:
          default: []
          description: List of updatable object IDs (UUIDs)
          items:
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            type: string
          type: array
        exceptions:
          description: "Subnet exceptions within included ranges that bypass the tunnel.\n\
            \n**Important:** Exceptions are only supported in 'out_of_tunnel' mode.\
            \ If provided when defaultTunnelingMode is 'via_tunnel', \nthe request\
            \ will be rejected with a 400 Bad Request error.\n\nBehavior in 'out_of_tunnel'\
            \ mode:\n- New exceptions are validated against allowed ranges (from included\
            \ destinations)\n- Saved exceptions are filtered according to actual allowed\
            \ ranges\n- Results are merged and deduplicated\n- Empty array will be\
            \ merged with existing exceptions and will not remove saved exceptions\
            \ by itself\n- If included destinations are removed from the payload and\
            \ there are saved exceptions related to those subnets, \n  these exceptions\
            \ will also be removed from the saved data\n- If omitted, exceptions value\
            \ remains unchanged\n"
          items:
            $ref: "#/components/schemas/SplitTunnelingException"
          type: array
      type: object
    SplitTunnelingException:
      additionalProperties: true
      description: |
        Subnet exception entry that can override the default tunnel behavior
        for specific IPs or CIDR ranges inside the encryption domain.

        **Important:** Exceptions are only supported in 'out_of_tunnel' mode. If provided when defaultTunnelingMode is 'via_tunnel',
        the request will be rejected with a 400 Bad Request error.

        The destination must be in CIDR notation (e.g. 10.1.2.0/24 for a subnet,
        10.1.2.3/32 for a single IP).

        Validation Rules (out_of_tunnel mode only):
        - Exception destination must be within at least one of the allowed included destinations
        - Exception destination cannot be equal to any allowed included destination
        - Exception destination cannot be bigger (more general) than any allowed included destination
        - Exceptions in the request payload that violate these rules cause a 400 Bad Request; only stored exceptions are automatically filtered during processing

        Exception Lifecycle (out_of_tunnel mode only):
        - When included destinations are removed from the configuration, any saved exceptions that fall
          outside the remaining allowed ranges are automatically removed
        - Exceptions are merged with existing saved exceptions and deduplicated by destination
      example:
        type: cidr
        destination: destination
      properties:
        type:
          default: cidr
          description: Type of destination.
          enum:
          - cidr
          type: string
        destination:
          description: "IP or CIDR string, e.g. \"10.1.2.0/24\" or \"10.1.2.3/32\"\
            ."
          type: string
      required:
      - destination
      - type
      type: object
    SplitTunnelingRequest:
      $ref: "#/components/schemas/SplitTunnelingBase"
    SplitTunnelingResponse:
      $ref: "#/components/schemas/SplitTunnelingBase"
