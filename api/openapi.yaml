        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get notification pages
      tags:
      - Internet Access Policies
    post:
      description: Create or update notification pages
      operationId: updateNotificationPages
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPagesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPagesMessageResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Create or update notification pages
      tags:
      - Internet Access Policies
  /v3/ia/inspection-settings:
    delete:
      description: "Reset traffic inspection settings to factory defaults, including\
        \ the revocation check timeout. Certificate validation rules return to their\
        \ defaults (the revoked action defaults to Block) and crliteEnabled returns\
        \ to true."
      operationId: deleteInspectionSettings
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Reset traffic inspection settings
      tags:
      - Internet Access Policies
    get:
      description: "Get traffic inspection settings (custom ports, certificate validation\
        \ rules, revocation check timeout and CRLite)"
      operationId: getInspectionSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionSettingsResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get traffic inspection settings
      tags:
      - Internet Access Policies
    post:
      description: |
        Update traffic inspection settings (custom ports, certificate validation rules and/or
        revocation check timeout and/or CRLite). At least one section is required.
        Each section (ports, invalidCertificatesSettings, revocationCheckTimeoutMs, crliteEnabled) is saved
        independently — omitting one preserves the existing value for that section.
      operationId: updateInspectionSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionSettingsResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update traffic inspection settings
      tags:
      - Internet Access Policies
  /v3/ia/dlp-settings:
    delete:
      description: Reset DLP settings to their default values (fail type open).
      operationId: deleteDlpSettings
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Reset DLP settings
      tags:
      - Internet Access Policies
    get:
      description: Get Data Loss Prevention (DLP) settings (fail type). Returns 403
        when the feature is not enabled for the tenant.
      operationId: getDlpSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpSettingsResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get DLP settings
      tags:
      - Internet Access Policies
    post:
      description: |
        Update Data Loss Prevention (DLP) settings. The fail type controls whether traffic is allowed (open)
        or blocked (close) when DLP inspection cannot be completed. Applies to all DLP rules.
        Rejected with 403 when the feature is not enabled for the tenant.
      operationId: updateDlpSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDlpSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpSettingsResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "404":
          description: SWG profile not found for the tenant
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update DLP settings
      tags:
      - Internet Access Policies
  /v3/objects/web-category:
