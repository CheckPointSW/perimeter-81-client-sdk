            example: ikev2
            type: string
          ikeLifeTime:
            $ref: "#/components/schemas/Lifetime"
          lifetime:
            $ref: "#/components/schemas/Lifetime"
          dpdDelay:
            $ref: "#/components/schemas/DPDTime"
          dpdTimeout:
            $ref: "#/components/schemas/DPDTime"
          phase1:
