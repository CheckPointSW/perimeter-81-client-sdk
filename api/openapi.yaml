    IPSecSubnetsBase:
      additionalProperties: true
      description: |
        The traffic selectors of an IPSec tunnel, meaning which subnets are reachable on each side. Together these two lists decide what traffic actually enters the tunnel.
      properties:
        p81GatewaySubnets:
          description: |
            Traffic selectors for the Check Point SASE side of the tunnel, meaning the subnets reachable *through* the SASE network. Must be CIDR notation. Only two values are accepted: either "0.0.0.0/0", to route all traffic through the tunnel, or the network's own subnet.
          items:
            example: 10.255.0.0/16
            format: cidr
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        remoteGatewaySubnets:
          description: |
            Traffic selectors for the customer side of the tunnel, meaning the on-premises subnets reachable *behind* the remote gateway. Values must be in CIDR notation.
          items:
            example: 192.168.10.0/24
            format: cidr
            type: string
          minItems: 1
          type: array
          uniqueItems: true
      required:
      - p81GatewaySubnets
      - remoteGatewaySubnets
      type: object
