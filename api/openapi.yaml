  /v3/networks/enhanced/{networkId}/tunnels/ipsec/dynamic:
    post:
      description: "Required permissions: `[\"network:create\"]`<br><br>Create a new\
        \ dynamic IPSec tunnel group in an enhanced network. The group holds 1-8 member\
        \ tunnels that are configured and managed together."
      operationId: createDynamicTunnel
      parameters:
      - explode: false
        in: path
        name: networkId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              singleTunnelPsk:
                description: |
                  Minimal working request. One member tunnel authenticated with a pre-shared key, routing all traffic (0.0.0.0/0) through the SASE network. `leftASN` fixes the network ASN, since this is the first dynamic tunnel on the network.
                summary: "Single tunnel, pre-shared key"
                value:
                  tunnelName: londonlink
                  description: Primary link to the London data center
                  tunnels:
                  - regionID: sXUeWwM8DM
                    authType: psk
                    passphrase: Str0ng.Shared_Key01
                    p81GWInternalIP: 169.254.10.1
                    remoteGWInternalIP: 169.254.10.2
                    remotePublicIP: 203.0.113.10
                    remoteASN: 65001
                    remoteID: londongw01
                    routingType: route
                  sharedSettings:
                    p81GatewaySubnets:
                    - 0.0.0.0/0
                    remoteGatewaySubnets:
                    - 192.168.10.0/24
                    leftASN: 64512
                    peakBandwidthMbps: 1000
                    features:
                      cloudSecurity:
                        enabled: false
                      symmetricInnerMesh:
                        enabled: false
                      DNSServices:
                        redirectToResolver:
                          enabled: true
                  advancedSettings:
                    keyExchange: ikev2
                    ikeLifeTime: 8h
                    lifetime: 1h
                    dpdDelay: 10s
                    dpdTimeout: 30s
                    phase1:
                      auth:
                      - sha256
                      encryption:
                      - aes256
                      keyExchangeMethod:
                      - modp2048
                    phase2:
                      auth:
                      - sha256
                      encryption:
                      - aes256
                      keyExchangeMethod:
                      - modp2048
              haTunnelCert:
                description: |
                  Redundant group with two member tunnels, authenticated with certificates. Each member uses a distinct set of IP addresses and its own remote ASN, but both share one `leftASN` and one set of traffic selectors. `customerRootCA` is the ID of a certificate already in the store.
                summary: "HA pair (two tunnels), certificate auth"
                value:
                  tunnelName: dclink
                  description: Redundant link to the Frankfurt data center
                  tunnels:
                  - regionID: sXUeWwM8DM
                    authType: cert
                    customerRootCA: GCt8HauIPH
                    p81GWInternalIP: 169.254.10.1
                    remoteGWInternalIP: 169.254.10.2
                    remotePublicIP: 203.0.113.10
                    remoteASN: 65001
                    remoteID: frankfurtgw01
                    routingType: route
                  - regionID: sXUeWwM8DM
                    authType: cert
                    customerRootCA: GCt8HauIPH
                    p81GWInternalIP: 169.254.10.5
                    remoteGWInternalIP: 169.254.10.6
                    remotePublicIP: 203.0.113.11
                    remoteASN: 65002
                    remoteID: frankfurtgw02
                    routingType: route
                  sharedSettings:
                    p81GatewaySubnets:
                    - 10.255.0.0/16
                    remoteGatewaySubnets:
                    - 192.168.10.0/24
                    - 192.168.20.0/24
                    leftASN: 64512
                    peakBandwidthMbps: 2000
                    features:
                      cloudSecurity:
                        enabled: false
                      symmetricInnerMesh:
                        enabled: true
                      DNSServices:
                        redirectToResolver:
                          enabled: true
                  advancedSettings:
                    keyExchange: ikev2
                    ikeLifeTime: 8h
                    lifetime: 1h
                    dpdDelay: 10s
                    dpdTimeout: 30s
                    phase1:
                      auth:
                      - sha256
                      encryption:
                      - aes256
                      keyExchangeMethod:
                      - modp2048
                    phase2:
                      auth:
                      - sha256
                      encryption:
                      - aes256
                      keyExchangeMethod:
                      - modp2048
            schema:
              $ref: "#/components/schemas/DynamicTunnelCreate"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncOperationResponse"
          description: Request accepted
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEnhancedRegion_429_response"
          description: Too many concurrent operations on this network
        "400":
          content:
            application/json:
              example:
                status: 400
                message: Bad Request Exception
                messageCode: BAD_REQUEST
                data:
                  errors:
                  - Invalid characters
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                message: Unauthorized
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                Message: User is not authorized to access this resource with an explicit
                  deny in an identity-based policy
              schema:
                $ref: "#/components/schemas/ForbiddenError"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                status: 404
                message: network doesn't exist
                messageCode: NOT_FOUND
              schema:
