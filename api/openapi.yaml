  /v3/networks/enhanced:
    get:
      description: "Required permissions: `[\"network:read\"]`<br><br>List all enhanced\
        \ networks"
      operationId: getEnhancedNetworks
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Enhanced network list.
                items:
                  $ref: "#/components/schemas/EnhancedNetwork"
                type: array
          description: Success
        "401":
          content:
            application/json:
              example:
