      description: |
        Creates a static (policy-routed) IPSec tunnel in an enhanced network. There is no BGP peering and no ASN: reachable subnets are stated explicitly in `p81GatewaySubnets` and `remoteGatewaySubnets`.
      example:
        authType: psk
        passphrase: Str0ng.Shared_Key01
        customerRootCA: GCt8HauIPH
        regionID: sXUeWwM8DM
        tunnelName: londonlink01
        p81GatewaySubnets:
