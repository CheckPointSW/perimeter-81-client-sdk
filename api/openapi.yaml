openapi: 3.0.0
info:
  contact: {}
  description: The YAML for Check Points SASE Public API
  title: Check Point - SASE Public API
  version: 3.0.0
servers:
- description: SASE Public API US
  url: https://public-apigw.us.sase.checkpoint.com
- description: SASE Public API EU
  url: https://public-apigw.eu.sase.checkpoint.com
- description: SASE Public API Australia
  url: https://public-apigw.au.sase.checkpoint.com
- description: SASE Public API India
  url: https://public-apigw.in.sase.checkpoint.com
- description: SASE Public API Canada
  url: https://public-apigw.ca.sase.checkpoint.com
security:
- bearer: []
paths:
  /v3/ia/access/policy:
    delete:
      description: Delete all access policy rules. Note that all internet traffic
        will be allowed after deletion.
      operationId: deleteAccessPolicy
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Delete all access policy rules
      tags:
      - Internet Access Policies
    get:
      description: List all access policy rules
      operationId: getAccessPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicyRulesGetResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get all access policy rules
      tags:
      - Internet Access Policies
    post:
      description: |
        Update/Create all access policy rules.
        Note that SASE offers a built-in IA policy.
      operationId: updateAccessPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessPolicyRulesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccessPolicyRulesResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update/Create all access policy rules
      tags:
      - Internet Access Policies
  /v3/ia/https-inspection/policy:
    delete:
      description: |
        Delete all HTTPS Inspection policy rules.
        Returns 422 if the request carries a non-empty rules array or a cleanupBypassRuleDefaultAction.
      operationId: deleteHttpsInspectionPolicy
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Delete all HTTPS Inspection policy rules
      tags:
      - Internet Access Policies
    get:
      description: List all HTTPS Inspection policy rules
      operationId: getHttpsInspectionPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpsInspectionPolicyGetResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get all HTTPS Inspection policy rules
      tags:
      - Internet Access Policies
    post:
      description: |
        Update/Create all HTTPS Inspection policy rules.
        Note that SASE offers a built-in HTTPS Inspection policy.
      operationId: updateHttpsInspectionPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertHttpsInspectionPolicy"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpsInspectionPolicyResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update/Create all HTTPS Inspection policy rules
      tags:
      - Internet Access Policies
  /v3/ia/status:
    get:
      description: "Get Internet Access Security Enforcement Status. This status indicates\
        \ whether Internet Access, Threat Prevention, and DLP are enabled or disabled."
      operationId: getIAStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getIAStatus_200_response"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get Internet Access security enforcement status
      tags:
      - Internet Access Policies
    post:
      description: "Update Internet Access Security Enforcement Status.This status\
        \ indicates whether Internet Access, Threat Prevention, and DLP are enabled\
        \ or disabled."
      operationId: setIAStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/setIAStatus_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/setIAStatus_request"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Update Internet Access security enforcement status
      tags:
      - Internet Access Policies
  /v3/ia/file-access/policy:
    delete:
      description: Delete all tenant-owned file access policy rules. The global default
        rule is unaffected.
      operationId: deleteFileAccessPolicy
      responses:
        "204":
          description: No content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Delete all file access policy rules
      tags:
      - Internet Access Policies
    get:
      description: List all file access policy rules
      operationId: getFileAccessPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAccessPolicyGetResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get all file access policy rules
      tags:
      - Internet Access Policies
    post:
      description: |
        Update/Create all file access policy rules.
        Sends all rules in a single request (full replace). At least one rule is required.
      operationId: updateFileAccessPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileAccessPolicyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAccessPolicyGetResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
      summary: Update/Create all file access policy rules
      tags:
      - Internet Access Policies
  /v3/ia/host-firewall/policy:
    delete:
      description: |
        Delete all host firewall rules.
        The body is optional. If sent, `protocolRules` must be an empty array; a non-empty array returns 422
        (DELETE_REQUEST_MUST_HAVE_EMPTY_ARRAY). Other keys are ignored.
      operationId: deleteHostFirewallPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteHostFirewallPolicyRequest"
        required: false
      responses:
        "204":
          description: No content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Delete all host firewall rules
      tags:
      - Internet Access Policies
    get:
      description: List all host firewall (network security protocol) rules
      operationId: getHostFirewallPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostFirewallPolicyResponse"
          description: Success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Get all host firewall rules
      tags:
      - Internet Access Policies
    post:
      description: |
        Update/Create all host firewall rules.
        Sends all rules in a single request (full replace). Rules omitted from the request are deleted.
        Returns 403 when the Host Firewall feature is not enabled for the tenant.
      operationId: updateHostFirewallPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostFirewallPolicyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostFirewallPolicyResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateAccessPolicy_400_response"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_403_response"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccessPolicy_500_response"
          description: Internal Server Error
      summary: Update/Create all host firewall rules
      tags:
      - Internet Access Policies
  /v3/ia/notification-pages:
