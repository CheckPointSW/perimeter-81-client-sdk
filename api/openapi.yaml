  /v3/networks/{networkId}/split-tunneling/async:
    put:
      description: |
        Required permissions: `["network:update"]`<br><br>Set up split tunneling configuration for a network asynchronously. Modifies tunnel all mode and exception data.

        **Important validation rules:**
        - Exceptions are only supported in 'out_of_tunnel' mode. Providing exceptions when defaultTunnelingMode is 'via_tunnel' will result in a 400 Bad Request error.
        - Addresses cannot be defined in a private network (routing table) and be excluded from 'tunnel all' at the same time.
        - In case of a contradiction, the addresses will be tunneled.

        Returns a beacon to track the async operation status.
      operationId: updateSplitTunnelingConfigurationAsync
      parameters:
      - explode: false
        in: path
        name: networkId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitTunnelingRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncOperationResponse"
          description: "Request accepted, async operation initiated"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEnhancedRegion_429_response"
          description: Too many concurrent operations on this network
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "409":
          content:
            application/json:
              examples:
                unsupported_updatable_object:
                  description: One or more updatable objects are not supported for
                    split tunneling
                  summary: Unsupported updatable object
                  value:
                    status: 409
                    message: UNSUPPORTED_UPDATABLE_OBJECT
                    messageCode: CONFLICT
                    data:
                      unsupportedCpIds:
                      - 9f8a29c1-4376-11e7-85af-005056c0000c
                updatable_object_not_found:
                  description: One or more specified updatable objects do not exist
                  summary: Updatable object not found
                  value:
                    status: 409
                    message: UPDATABLE_OBJECT_NOT_FOUND
                    messageCode: CONFLICT
                    data:
                      notExistingCpIds:
                      - foobar
              schema:
                $ref: "#/components/schemas/updateSplitTunnelingConfigurationAsync_409_response"
          description: Conflict - Issues with updatable objects in split tunneling
            configuration
      summary: Set up split tunneling configuration (async)
      tags:
      - Networks
