        "401":
          content:
            application/json:
              example:
                message: Unauthorized
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                Message: User is not authorized to access this resource with an explicit
                  deny in an identity-based policy
              schema:
                $ref: "#/components/schemas/ForbiddenError"
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                status: 404
                message: network doesn't exist
                messageCode: NOT_FOUND
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
        "409":
          content:
            application/json:
              examples:
                unsupported_updatable_object:
                  description: One or more updatable objects are not supported for
                    split tunneling
                  summary: Unsupported updatable object
                  value:
                    status: 409
                    message: UNSUPPORTED_UPDATABLE_OBJECT
                    messageCode: CONFLICT
                    data:
                      unsupportedCpIds:
                      - 9f8a29c1-4376-11e7-85af-005056c0000c
