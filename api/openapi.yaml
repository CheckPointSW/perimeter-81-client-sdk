openapi: 3.0.0
info:
  contact: {}
  description: The YAML for Check Points SASE Public API
  title: Check Point - SASE Public API
  version: 3.0.0
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/perimeter81/public-api-yaml/1.0.0
- description: SASE Public API US
  url: https://api.perimeter81.com/api/rest
- description: SASE Public API EU
  url: https://api.eu.sase.checkpoint.com/api/rest
- description: SASE Public API Australia
  url: https://api.au.sase.checkpoint.com/api/rest
- description: SASE Public API India
  url: https://api.in.sase.checkpoint.com/api/rest
- description: SASE Public API Canada
